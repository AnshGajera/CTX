<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CTX Dashboard</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--border:#1e2a45;--txt:#dbe4f5;--dim:#8ea0c2;--acc:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;background:#0b1220ee;border-bottom:1px solid var(--border);padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header h1 span{color:var(--acc)}
.pill{border:1px solid var(--border);border-radius:20px;padding:2px 10px;color:var(--dim);font-size:12px}
button{background:#1a2742;color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
.card b{font-size:22px;display:block}.card span{color:var(--dim);font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
nav button.active{background:var(--acc);color:#04202e;border-color:var(--acc);font-weight:700}
section.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:600}code{background:#0a0f1f;padding:1px 6px;border-radius:6px;border:1px solid var(--border)}
input,select{background:#0a0f1f;color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
pre{background:#0a0f1f;border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto;max-height:380px;font-size:12px}
.add{color:var(--ok)}.del{color:var(--bad)}.dim{color:var(--dim)}
a{color:var(--acc)}
</style>
</head>
<body>
<header>
<h1><span>CTX</span> dashboard</h1>
<span class="pill" id="p-project">…</span>
<span class="pill" id="p-branch">…</span>
<span class="pill" id="p-hash">…</span>
<span style="flex:1"></span>
<button onclick="loadAll()">Refresh</button>
<a href="/context" target="_blank"><button>JSON</button></a>
</header>
<main>
<div class="cards" id="cards"></div>
<nav id="tabs">
<button data-t="overview" class="active">Overview</button>
<button data-t="apis">APIs</button>
<button data-t="schema">Schema</button>
<button data-t="env">Env</button>
<button data-t="deps">Deps</button>
<button data-t="history">History &amp; Diff</button>
<button data-t="search">Search</button>
</nav>
<section class="panel" id="view"></section>
<p class="dim">Local-first viewer. Data from <code>/context/*</code> + <code>/api/history</code> + <code>/api/diff</code> + <code>/api/search</code>. No data leaves localhost.</p>
</main>
<script>
const $=s=>document.querySelector(s);
let CACHE={summary:null,apis:null,db:null,env:null,deps:null,ctx:null,history:null,diff:null};
let tab="overview";
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();});
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(u+" -> "+r.status);return r.json();}
async function loadAll(){
try{
CACHE.summary=await j("/context/summary");
$("#p-project").textContent=CACHE.summary.project||"?";
$("#p-branch").textContent=CACHE.summary.branch||"no git";
$("#p-hash").textContent=(CACHE.summary.hash||"").slice(0,12)||"no hash";
const c=CACHE.summary.counts||{};
$("#cards").innerHTML=["endpoints","models","env_vars","dependencies"].map(k=>`<div class=card><b>${c[k]??"–"}</b><span>${k.replace("_"," ")}</span></div>`).join("");
CACHE.ctx=await j("/context").catch(()=>null);
CACHE.apis=await j("/context/apis").catch(()=>null);
CACHE.db=await j("/context/database").catch(()=>null);
CACHE.env=await j("/context/env").catch(()=>null);
CACHE.deps=await j("/context/dependencies").catch(()=>null);
CACHE.history=await j("/api/history").catch(()=>null);
CACHE.diff=await j("/api/diff").catch(()=>null);
}catch(e){$("#view").innerHTML="<b>Load failed:</b> "+e+"<br><span class=dim>Run <code>ctx extract</code> first, then <code>ctx serve --ui</code> in the project root.</span>";return;}
render();
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(){
const v=$("#view");
if(tab==="overview"){
const s=CACHE.summary||{};const langs=(s.languages||[]).map(l=>esc(l.name)+" "+(l.percentage||0).toFixed(0)+"%").join(", ")||"–";
const fws=(s.frameworks||[]).map(f=>esc(f.name)).join(", ")||"–";
const a=CACHE.ctx&&CACHE.ctx.architecture?CACHE.ctx.architecture.pattern||"–":"–";
v.innerHTML=`<h3>Overview</h3><table>
<tr><th>Project</th><td>${esc(s.project||"")}</td></tr>
<tr><th>Type</th><td>${esc(s.type||"")}</td></tr>
<tr><th>Languages</th><td>${langs}</td></tr>
<tr><th>Frameworks</th><td>${fws}</td></tr>
<tr><th>Architecture</th><td>${esc(a)}</td></tr>
<tr><th>Diagram</th><td><pre>${esc(CACHE.ctx&&CACHE.ctx.architecture&&CACHE.ctx.architecture.diagram||"no diagram")}</pre></td></tr></table>`;
}else if(tab==="apis"){
const eps=(CACHE.apis&&CACHE.apis.endpoints)||[];
v.innerHTML=`<h3>Endpoints (${eps.length})</h3>
<div class=toolbar><input id=f-path placeholder="filter path… e.g. /users" oninput="drawAPIs()"><select id=f-method onchange="drawAPIs()"><option value="">all methods</option><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>ALL</option></select></div>
<div id=api-table></div>`;
drawAPIs();
}else if(tab==="schema"){
const m=(CACHE.db&&CACHE.db.models)||[];
v.innerHTML=`<h3>Models (${m.length})</h3>`+m.map(x=>`<details><summary><code>${esc(x.name)}</code> <span class=dim>${esc(x.table||"")} · ${esc(x.file||"")}</span></summary><table><tr><th>field</th><th>type</th><th>flags</th></tr>${(x.fields||[]).map(f=>`<tr><td><code>${esc(f.name)}</code></td><td>${esc(f.type)}</td><td class=dim>${[f.primary_key?"PK":"",f.unique?"UQ":"",f.nullable?"null":"",f.reference?("→ "+f.reference):""].filter(Boolean).join(" ")}</td></tr>`).join("")}</table></details>`).join("")+`<h3>ER diagram</h3><pre>${esc(CACHE.db&&CACHE.db.diagram||"no diagram")}</pre>`;
}else if(tab==="env"){
const vs=(CACHE.env&&CACHE.env.variables)||[];
v.innerHTML=`<h3>Env vars (${vs.length}) — names only, values never stored</h3><table><tr><th>name</th><th>required</th><th>category</th><th>default</th></tr>${vs.map(x=>`<tr><td><code>${esc(x.name)}</code></td><td>${x.required?"yes":"no"}</td><td>${esc(x.category||"")}</td><td class=dim>${esc(x.default||"")}</td></tr>`).join("")}</table>`;
}else if(tab==="deps"){
const d=(CACHE.deps&&CACHE.deps.direct)||[];
v.innerHTML=`<h3>Dependencies (${d.length})</h3><table><tr><th>name</th><th>version</th><th>category</th></tr>${d.map(x=>`<tr><td>${esc(x.name)}</td><td class=dim>${esc(x.version||"")}</td><td>${esc(x.category||"")}</td></tr>`).join("")}</table>`;
}else if(tab==="history"){
const h=(CACHE.history&&CACHE.history.snapshots)||[];const diff=CACHE.diff||{};
v.innerHTML=`<h3>Diff HEAD</h3><p>${esc(diff.summary||"no diff")}</p>
<p class=add>${(diff.added_endpoints||[]).map(e=>"+ "+esc(e.method)+" "+esc(e.path)).join("<br>")}</p>
<p class=del>${(diff.removed_endpoints||[]).map(e=>"- "+esc(e.method)+" "+esc(e.path)).join("<br>")}</p>
<p class=add>${(diff.added_models||[]).map(e=>"+ model "+esc(e.name)).join("<br>")}</p>
<p class=del>${(diff.removed_models||[]).map(e=>"- model "+esc(e.name)).join("<br>")}</p>
<h3>History (${h.length})</h3><table><tr><th>hash</th><th>time</th><th>author</th><th>message</th><th>git</th></tr>${h.map(s=>`<tr><td><code>${esc((s.hash||"").slice(0,12))}</code></td><td class=dim>${esc(s.timestamp||"")}</td><td>${esc(s.author||"")}</td><td>${esc(s.message||"")}</td><td class=dim>${esc(s.git_branch||"")} ${esc((s.git_commit||"").slice(0,7))}</td></tr>`).join("")}</table>`;
}else if(tab==="search"){
v.innerHTML=`<h3>Search context</h3><div class=toolbar><input id=q style="flex:1" placeholder="e.g. where is auth handled?"><button onclick="doSearch()">Search</button></div><div id=results class=dim>Type a query, backed by <code>GET /api/search?q=</code> (TF-IDF, offline).</div>`;
}
}
function drawAPIs(){
const fp=($("#f-path")||{}).value||"";const fm=($("#f-method")||{}).value||"";
const eps=((CACHE.apis&&CACHE.apis.endpoints)||[]).filter(e=>(!fp||e.path.toLowerCase().includes(fp.toLowerCase()))&&(!fm||e.method===fm));
$("#api-table").innerHTML=`<table><tr><th>method</th><th>path</th><th>file</th><th>auth</th></tr>${eps.map(e=>`<tr><td><code>${esc(e.method)}</code></td><td><code>${esc(e.path)}</code></td><td class=dim>${esc(e.file||"")}${e.line?":"+e.line:""}</td><td>${e.auth_required?"🔒":""}</td></tr>`).join("")}</table>`;
}
async function doSearch(){
const q=$("#q").value.trim();if(!q)return;
$("#results").textContent="Searching…";
try{const r=await j("/api/search?q="+encodeURIComponent(q));
$("#results").innerHTML=(r.results||[]).map((x,i)=>`<p><b>${i+1}. [${esc(x.kind)}] ${esc(x.id)}</b> <span class=dim>${(x.score||0).toFixed(3)} · ${esc(x.source||"")}</span><br>${esc((x.text||"").slice(0,300))}</p>`).join("")||"No results.";}
catch(e){$("#results").textContent="Search failed: "+e;}
}
loadAll();
</script>
</body>
</html>
