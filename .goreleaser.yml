version: 2
project_name: ctx
builds:
  - id: ctx
    main: ./cmd/ctx
    binary: ctx
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/AnshGajera/CTX/internal/version.Version={{.Version}} -X github.com/AnshGajera/CTX/internal/version.Commit={{.Commit}} -X github.com/AnshGajera/CTX/internal/version.Date={{.Date}}
archives:
  - id: default
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - LICENSE
checksum:
  name_template: checksums.txt
  algorithm: sha256
